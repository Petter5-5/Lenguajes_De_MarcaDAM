<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Yeray Trejo Sánchez">
    <link rel="stylesheet" href="estilos.css">
    <title>Calculadora</title>
</head>
<body>
    <header>
        <p>CALCULADORA</p>
    </header>
    <main>
        <div class="fondo_calculadora">
            <div class="pantalla_calculadora">
                <h1 id="pantalla_calculadora"></h1>
            </div>
                <div class="grid_1">
                    <div>
                        <button class="button_largo_1">CE</button>
                    </div>
                    <div>
                        <button class="button_color_3b3b3b">C</button>
                    </div>
                    <div>
                        <button class="button_color_3b3b3b" id="btnretrocede"><img src="imagenes/icon_backspace_white_normal.svg"></button>
                    </div>
                </div>
                <div class="grid_2">
                    <div>
                        <button class="button_color_3b3b3b"><img src="imagenes/icon_1_over_x_white_normal.svg"></button>
                    </div>
                    <div>
                        <button class="button_color_3b3b3b"><img src="imagenes/icon_x_squared_white_normal.svg"></button>
                    </div>
                    <div>
                        <button class="button_color_3b3b3b"><img src="imagenes/icon_square_root_white_normal.svg"></button>
                    </div>
                    <div>
                        <button class="button_color_4b4bff">/</button>
                    </div>
                    <div>
                        <button>7</button>
                    </div>
                    <div>
                        <button>8</button>
                    </div>
                    <div>
                        <button>9</button>
                    </div>
                    <div>
                        <button class="button_color_4b4bff">x</button>
                    </div>
                    <div>
                        <button>4</button>
                    </div>
                    <div>
                        <button>5</button>
                    </div>
                    <div>
                        <button>6</button>
                    </div>
                    <div>
                        <button class="button_color_4b4bff">-</button>
                    </div>
                    <div>
                        <button id="btn1">1</button>
                    </div>
                    <div>
                        <button id="btn2">2</button>
                    </div>
                    <div>
                        <button>3</button>
                    </div>
                    <div>
                        <button class="button_color_4b4bff">+</button>
                    </div>
                </div>
                <div class="grid_1">
                    <div>
                        <button class="button_largo_2">0</button>
                    </div>
                    <div>
                        <button>.</button>
                    </div>
                    <div>
                        <button class="button_color_ff9500">=</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p> Ejercicio 01 UD 03 - LENGUAJES DE MARCAS Y SISTEMAS DE GESTIÓN DE INFORMACIÓn</p>
        <p class="footer_2">PROYECTO REALIZADO POR: YERAY TREJO SÁNCHEZ (DECLARO QUE NO HE USADO IA EN EL PROYECTO)</p>
    </footer>
    <script src="js/javascript.js"></script>
</body>
</html>
