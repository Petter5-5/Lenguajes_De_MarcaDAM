<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Yeray Trejo Sánchez">
    <link rel="stylesheet" href="estilos.css">
    <title>Calculadora</title>
    <link rel="stylesheet" media="screen" href="https://fontlibrary.org//face/segment7" type="text/css"/>
</head>
<body>
    <header>
        <p>CALCULADORA</p>
    </header>
    <main>
        <div class="fondo_calculadora">
            <div class="pantalla_calculadora">
                <h1 id="pantalla_calculadora">0</h1>
            </div>
                <div class="grid_1">
                    <div>
                        <button class="button_largo_1" id="borraEntrada">CE</button>
                    </div>
                    <div>
                        <button class="button_color_3b3b3b" id="eliminar"">C</button>
                    </div>
                    <div>
                        <button class="button_color_3b3b3b" id="btnretrocede"><img src="imagenes/icon_backspace_white_normal.svg"></button>
                    </div>
                </div>
                <div class="grid_2">
                    <div>
                        <button class="button_color_3b3b3b" id="inversor"><img src="imagenes/icon_1_over_x_white_normal.svg"></button>
                    </div>
                    <div>
                        <button class="button_color_3b3b3b" id="cuadrado"><img src="imagenes/icon_x_squared_white_normal.svg"></button>
                    </div>
                    <div>
                        <button class="button_color_3b3b3b" id="raiz"><img src="imagenes/icon_square_root_white_normal.svg"></button>
                    </div>
                    <div>
                        <button class="button_color_4b4bff" id="dividir">/</button>
                    </div>
                    <div>
                        <button id="btn7">7</button>
                    </div>
                    <div>
                        <button id="btn8">8</button>
                    </div>
                    <div>
                        <button id="btn9">9</button>
                    </div>
                    <div>
                        <button class="button_color_4b4bff" id="multiplicar">x</button>
                    </div>
                    <div>
                        <button id="btn4">4</button>
                    </div>
                    <div>
                        <button id="btn5">5</button>
                    </div>
                    <div>
                        <button id="btn6">6</button>
                    </div>
                    <div>
                        <button class="button_color_4b4bff" id="menos">-</button>
                    </div>
                    <div>
                        <button id="btn1">1</button>
                    </div>
                    <div>
                        <button id="btn2">2</button>
                    </div>
                    <div>
                        <button id="btn3">3</button>
                    </div>
                    <div>
                        <button class="button_color_4b4bff" id="suma">+</button>
                    </div>
                </div>
                <div class="grid_1">
                    <div>
                        <button class="button_largo_2" id="btn0">0</button>
                    </div>
                    <div>
                        <button id="punto">.</button>
                    </div>
                    <div>
                        <button class="button_color_ff9500" id="resultado">=</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p><b>Ejercicio 01 UD 03 - LENGUAJES DE MARCAS Y SISTEMAS DE GESTIÓN DE INFORMACIÓn</b></p>
        <p class="footer_2"><u>PROYECTO REALIZADO POR:</u> YERAY TREJO SÁNCHEZ (DECLARO QUE NO HE USADO IA EN EL PROYECTO)</p>
    </footer>
    <script src="js/javascript.js"></script>
</body>
</html>
